; Pillba MCU firmware: one project, one shared set of drivers in lib/, one app per env.
;
;   pio run  -d firmware -e production          framed UART firmware (115200)
;   pio run  -d firmware -e bench_console       plain-text bench console (9600)
;   pio run  -d firmware -e production -t upload --upload-port /dev/cu.usbserial-XXXX
;   pio test -d firmware -e native              host unit tests (protocol, dispatch, dispense rules)
;
; Put a personal upload_port in platformio_override.ini (gitignored), see platformio_override.ini.example.

[platformio]
default_envs = production
extra_configs = platformio_override.ini

; ATmega328P on the Pillba PCB, 16 MHz crystal, programmed through an Arduino-as-ISP (stk500v1).
[pcb]
platform = atmelavr
board = ATmega328P
framework = arduino
board_build.f_cpu = 16000000L
lib_deps =
    arduino-libraries/Servo@^1.2.1
    bogde/HX711@^0.7.5
upload_protocol = stk500v1
upload_speed = 19200
upload_flags =
    -P$UPLOAD_PORT
    -b$UPLOAD_SPEED
    -e
board_fuses.lfuse = 0xFF
board_fuses.hfuse = 0xD9
board_fuses.efuse = 0xFD
test_ignore = *

[env:production]
extends = pcb
monitor_speed = 115200
build_src_filter = +<apps/production/>

[env:bench_console]
extends = pcb
monitor_speed = 9600
build_src_filter = +<apps/bench_console/>

; Host tests for the pure modules only (protocol, dispense_rules).
[env:native]
platform = native
test_framework = unity
lib_ignore = board, stepper_bank, shield, ir_beam, scale, pump, dispense
build_flags = -std=c++11 '-DFRAME_VECTORS_PATH="${PROJECT_DIR}/../protocol/test_vectors/frame_vectors.json"'
