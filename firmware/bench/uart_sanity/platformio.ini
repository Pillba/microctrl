; UART sanity check: no motors, no servo, no scale. See README.md.
;   pio run -d firmware/bench/uart_sanity -e pcb -t upload          115200 baud (what production uses)
;   pio run -d firmware/bench/uart_sanity -e pcb_9600 -t upload     9600 baud (slower, more forgiving)

[env:pcb]
platform = atmelavr
board = ATmega328P
framework = arduino
board_build.f_cpu = 16000000L
monitor_speed = 115200
build_flags = -DSANITY_BAUD=115200
upload_protocol = stk500v1
upload_port = /dev/cu.usbserial-1140
upload_speed = 19200
upload_flags =
    -P$UPLOAD_PORT
    -b$UPLOAD_SPEED
    -e

[env:pcb_9600]
extends = env:pcb
monitor_speed = 9600
build_flags = -DSANITY_BAUD=9600

; Arduino Nano, to test a USB-UART cable on a known-good board. Uploads over the Nano's own USB.
; Old-bootloader Nanos (most clones) use env nano; if upload fails with "not in sync", use nano_new.
[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
build_flags = -DSANITY_BAUD=115200

[env:nano_new]
extends = env:nano
board = nanoatmega328new
