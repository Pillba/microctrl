[env:pcb]
platform = atmelavr
board = ATmega328P
framework = arduino
board_build.f_cpu = 16000000L
monitor_speed = 9600
lib_deps =
    arduino-libraries/Servo@^1.2.1
    bogde/HX711@^0.7.5
upload_protocol = stk500v1
upload_port = /dev/cu.usbserial-1140
upload_speed = 19200
upload_flags =
    -P$UPLOAD_PORT
    -b$UPLOAD_SPEED
    -e
board_fuses.lfuse = 0xFF
board_fuses.hfuse = 0xD9
board_fuses.efuse = 0xFD